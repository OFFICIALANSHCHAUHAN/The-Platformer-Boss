<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Dash - Mobile Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body { background-color: #0d1117; color: #f0f6fc; overflow: hidden; }
        canvas { image-rendering: pixelated; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 select-none">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-2">
        <h1 class="text-lg font-black text-cyan-400">CYBER DASH MULTIPLAYER</h1>
        <div id="status" class="text-xs px-2 py-1 bg-yellow-500/20 text-yellow-300 rounded border border-yellow-500/30">
            Connecting...
        </div>
    </header>

    <!-- Canvas -->
    <main class="relative w-full max-w-4xl flex-1 flex items-center justify-center my-2">
        <canvas id="gameCanvas" class="rounded-xl border border-gray-800 bg-slate-950 w-full h-full max-h-[500px] object-contain"></canvas>
    </main>

    <!-- Mobile Touch Controls -->
    <footer class="w-full max-w-4xl flex justify-between items-center px-2 py-2 gap-4">
        <div class="flex gap-2">
            <button id="btn-left" class="w-16 h-16 bg-gray-800 active:bg-cyan-600 text-2xl text-white rounded-2xl flex items-center justify-center border border-gray-700">◀</button>
            <button id="btn-right" class="w-16 h-16 bg-gray-800 active:bg-cyan-600 text-2xl text-white rounded-2xl flex items-center justify-center border border-gray-700">▶</button>
        </div>
        <button id="btn-jump" class="w-20 h-16 bg-blue-600 active:bg-blue-500 text-lg font-bold text-white rounded-2xl flex items-center justify-center border border-blue-400">JUMP</button>
    </footer>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 450;

        let myId = null;
        let otherPlayers = {};
        
        const myPlayer = {
            x: 50, y: 310, w: 24, h: 32,
            vx: 0, vy: 0, speed: 4.5, jumpForce: -10, gravity: 0.5,
            grounded: false, jumpsLeft: 2, facingRight: true, color: '#06b6d4'
        };

        const touch = { left: false, right: false, jumpPressed: false };

        // --- Socket Events ---
        socket.on('init', (data) => {
            myId = data.id;
            document.getElementById('status').innerText = 'Connected! 🎮';
            document.getElementById('status').className = 'text-xs px-2 py-1 bg-green-500/20 text-green-300 rounded border border-green-500/30';
            
            Object.keys(data.players).forEach(id => {
                if (id !== myId) otherPlayers[id] = data.players[id];
                else myPlayer.color = data.players[id].color;
            });
        });

        socket.on('playerJoined', (player) => {
            otherPlayers[player.id] = player;
        });

        socket.on('playerMoved', (player) => {
            if (otherPlayers[player.id]) {
                otherPlayers[player.id].x = player.x;
                otherPlayers[player.id].y = player.y;
                otherPlayers[player.id].facingRight = player.facingRight;
            }
        });

        socket.on('playerDisconnected', (id) => {
            delete otherPlayers[id];
        });

        // --- Game Physics ---
        const groundY = 350;

        function update() {
            if (touch.left) {
                myPlayer.vx = -myPlayer.speed;
                myPlayer.facingRight = false;
            } else if (touch.right) {
                myPlayer.vx = myPlayer.speed;
                myPlayer.facingRight = true;
            } else {
                myPlayer.vx *= 0.7;
            }

            if (touch.jumpPressed && myPlayer.jumpsLeft > 0) {
                myPlayer.vy = myPlayer.jumpForce;
                myPlayer.grounded = false;
                myPlayer.jumpsLeft--;
            }
            touch.jumpPressed = false;

            myPlayer.vy += myPlayer.gravity;
            myPlayer.x += myPlayer.vx;
            myPlayer.y += myPlayer.vy;

            // Simple floor collision
            if (myPlayer.y + myPlayer.h >= groundY) {
                myPlayer.y = groundY - myPlayer.h;
                myPlayer.vy = 0;
                myPlayer.grounded = true;
                myPlayer.jumpsLeft = 2;
            }

            // Boundaries
            if (myPlayer.x < 0) myPlayer.x = 0;
            if (myPlayer.x + myPlayer.w > canvas.width) myPlayer.x = canvas.width - myPlayer.w;

            // Send movement to server
            socket.emit('playerMove', {
                x: myPlayer.x,
                y: myPlayer.y,
                facingRight: myPlayer.facingRight
            });
        }

        function drawPlayer(p) {
            ctx.fillStyle = p.color || '#06b6d4';
            ctx.fillRect(p.x, p.y, p.w || 24, p.h || 32);
            
            // Visor
            ctx.fillStyle = '#f43f5e';
            const visorX = p.facingRight ? p.x + 12 : p.x + 2;
            ctx.fillRect(visorX, p.y + 6, 10, 6);
        }

        function loop() {
            ctx.fillStyle = '#090d16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            update();
            drawPlayer(myPlayer);

            // Draw other player
            Object.values(otherPlayers).forEach(p => drawPlayer(p));

            requestAnimationFrame(loop);
        }

        // --- Touch Event Listeners ---
        const bind = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (key === 'jump') touch.jumpPressed = true;
                else touch[key] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (key !== 'jump') touch[key] = false;
            });
        };

        bind('btn-left', 'left');
        bind('btn-right', 'right');
        bind('btn-jump', 'jump');

        loop();
    </script>
</body>
  </html>
