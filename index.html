<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CYBER DASH 50 LEVELS</title>
<style>
body{margin:0;background:#060814;font-family:'Arial';overflow:hidden;color:white}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0a1020}
#title{color:#00d4ff;font-weight:bold;font-size:16px}
#stats{display:flex;gap:10px;align-items:center}
.badge{background:#1a2340;padding:5px 8px;border-radius:8px;font-size:12px}
#level{color:#00d4ff;font-weight:bold}
#hearts{color:#ff0055}
canvas{display:block;background:#060814;margin:0 auto}
#grid{background-image:linear-gradient(#112240 1px,transparent 1px),linear-gradient(90deg,#112240 1px,transparent 1px);background-size:40px 40px}
#controls{display:flex;justify-content:space-between;padding:20px}
.btn{width:80px;height:80px;background:#1a2340;border:2px solid #00d4ff;border-radius:20px;color:white;font-size:30px;display:flex;align-items:center;justify-content:center;user-select:none}
#jump{width:100px;height:100px;background:#0055ff;border-color:#00aaff;font-size:18px;font-weight:bold}
#adminMenu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a1020;border:2px solid #ff00ff;padding:20px;border-radius:10px;display:none;z-index:100}
#adminMenu input{width:60px;margin:5px;background:#1a2340;color:#00d4ff;border:1px solid #00d4ff}
#adminMenu button{margin:5px;padding:8px;background:#ff00ff;color:white;border:none;border-radius:5px}
#win{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a1020;padding:30px;border-radius:15px;border:2px solid #00d4ff;font-size:24px;text-align:center;display:none;z-index:100}
</style>
</head>
<body>
<div id="hud">
  <div id="title">CYBER<br>DASH</div>
  <div id="stats">
    <div class="badge">LVL <span id="level">1</span>/50</div>
    <div class="badge">❤️ <span id="hearts">0</span>/10</div>
  </div>
</div>

<canvas id="grid" width="800" height="400"></canvas>

<div id="controls">
  <div style="display:flex;gap:10px">
    <div class="btn" id="left">◀</div>
    <div class="btn" id="right">▶</div>
  </div>
  <div class="btn" id="jump">JUMP</div>
</div>

<div id="adminMenu">
  <h3 style="color:#ff00ff;text-align:center">🔥 ADMIN MENU 🔥</h3>
  <div>Level: <input type="number" id="adminLevel" min="1" max="50" value="1"></div>
  <div>Hearts: <input type="number" id="adminHearts" min="0" max="10" value="0"></div>
  <button onclick="applyAdmin()">Apply</button>
  <button onclick="skipLevel()">Skip Level</button>
  <button onclick="closeAdmin()">Close</button>
</div>

<div id="win">🏆 YOU WON! 🏆<br>50 LEVELS COMPLETE<br><button onclick="location.reload()">Play Again</button></div>

<script>
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');

let player = {x:60,y:320,w:20,h:20,vx:0,vy:0,onGround:false}
let keys = {left:false,right:false,jump:false}
let level = 1, hearts = 0;
let platforms = [];
let heartItems = [];
let gravity = 0.6;

// ADMIN SECRET: Hold LEFT + RIGHT + JUMP for 5 seconds
let comboTimer = null;
let comboStart = 0;

function generateLevel(lvl){
  platforms = [{x:0,y:360,w:800,h:40}]; // ground
  heartItems = [];
  
  let platCount = 3 + Math.floor(lvl/5); // gets harder
  for(let i=0;i<platCount;i++){
    let gap = 120 + lvl*2;
    platforms.push({x:100+i*gap%700, y:320-i*50, w:Math.max(60,120-lvl), h:10})
  }
  
  // Spawn 10 hearts randomly on platforms
  for(let i=0;i<10;i++){
    let p = platforms[Math.floor(Math.random()*platforms.length)];
    heartItems.push({x:p.x+p.w/2-10, y:p.y-20, w:20, h:20, collected:false})
  }
}

function update(){
  if(keys.left) player.vx = -5;
  else if(keys.right) player.vx = 5;
  else player.vx = 0;
  
  player.vy += gravity;
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;
  
  // platform collision
  platforms.forEach(p=>{
    if(player.x < p.x+p.w && player.x+player.w > p.x && 
       player.y < p.y+p.h && player.y+player.h > p.y && player.vy>0){
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  })
  
  // collect hearts
  heartItems.forEach(h=>{
    if(!h.collected && 
       player.x < h.x+h.w && player.x+player.w > h.x && 
       player.y < h.y+h.h && player.y+player.h > h.y){
      h.collected = true;
      hearts++;
      document.getElementById('hearts').innerText = hearts;
    }
  })
  
  // next level
  if(hearts >= 10){
    if(level >= 50){
      document.getElementById('win').style.display='block';
    }else{
      level++;
      hearts = 0;
      document.getElementById('level').innerText = level;
      document.getElementById('hearts').innerText = hearts;
      generateLevel(level);
      player.x=60; player.y=320;
    }
  }
  
  // fall
  if(player.y > 400){
    player.x=60; player.y=320;
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // platforms
  ctx.fillStyle = '#00d4ff';
  platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));
  // player
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(player.x,player.y,player.w,player.h);
  // hearts
  heartItems.forEach(h=>{
    if(!h.collected){
      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      ctx.arc(h.x+5,h.y+5,5,0,Math.PI*2);
      ctx.arc(h.x+15,h.y+5,5,0,Math.PI*2);
      ctx.lineTo(h.x+10,h.y+15);
      ctx.fill();
    }
  })
  requestAnimationFrame(draw);
}

// mobile controls
['left','right','jump'].forEach(id=>{
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart',()=>{
    if(!comboStart) comboStart = Date.now();
    if(id==='left') keys.left=true;
    if(id==='right') keys.right=true;
    if(id==='jump' && player.onGround) player.vy=-12;
    
    // 5 second admin combo
    if(keys.left && keys.right && keys.jump){
      clearTimeout(comboTimer);
      comboTimer = setTimeout(()=>{
        if(Date.now()-comboStart >= 5000){
          document.getElementById('adminMenu').style.display='block';
          document.getElementById('adminLevel').value=level;
          document.getElementById('adminHearts').value=hearts;
        }
      },5000)
    }
  })
  btn.addEventListener('touchend',()=>{
    if(id==='left') keys.left=false;
    if(id==='right') keys.right=false;
    if(id==='jump') keys.jump=false;
    if(!keys.left && !keys.right && !keys.jump) comboStart=0;
  })
})

function applyAdmin(){
  level = parseInt(document.getElementById('adminLevel').value);
  hearts = parseInt(document.getElementById('adminHearts').value);
  document.getElementById('level').innerText = level;
  document.getElementById('hearts').innerText = hearts;
  generateLevel(level);
  player.x=60; player.y=320;
  closeAdmin();
}
function skipLevel(){ level++; hearts=0; generateLevel(level); closeAdmin(); }
function closeAdmin(){ document.getElementById('adminMenu').style.display='none'; }

generateLevel(1);
setInterval(update,1000/60);
draw();
</script>
</body>
</html>
